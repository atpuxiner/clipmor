<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipmor - Windows 剪贴板增强工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            background-color: #f4f7fa;
            color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            padding: 48px 40px;
            max-width: 620px;
            width: 100%;
        }
        h1 {
            font-size: 2.5rem;
            color: #1a1a1a;
            margin-bottom: 12px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .links a {
            display: inline-block;
            text-decoration: none;
            color: #2563eb;
            font-weight: 500;
            padding: 10px 20px;
            border: 1px solid #2563eb;
            border-radius: 8px;
            transition: all 0.2s ease;
            margin-right:12px;
            margin-bottom:12px;
        }
        .links a:hover {
            background-color: #2563eb;
            color: white;
        }
        .footer-note {
            margin-top: 36px;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Clipmor</h1>
        <p class="subtitle">Windows 剪贴板增强待办工具。快速捕获剪贴内容，管理待办事项。</p>
        <div class="links">
            <a href="./privacy.html">隐私政策</a>
            <a href="https://github.com/atpuxiner/clipmor" target="_blank">GitHub 仓库</a>
        </div>
        <div class="footer-note">
            轻量极简、低资源占用
        </div>
    </div>
</body>
</html>
